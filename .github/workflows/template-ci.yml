# Template-only: init deletes this file. Runs modules/tools/smoke.sh on the three OSes.
name: template-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ajv outside the repo
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/ajv" ajv@8.17.1 --no-audit --no-fund
          echo "AJV_DIR=$RUNNER_TEMP/ajv" >> "$GITHUB_ENV"
      - name: Smoke test
        shell: bash
        run: sh modules/tools/smoke.sh
